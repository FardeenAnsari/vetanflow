<svg width="1400" height="620" viewBox="0 0 1400 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">VetanFlow payroll operations platform</title>
  <desc id="desc">An animated product overview showing people records moving through attendance, payroll review, approval, and payslip delivery.</desc>
  <style>
    .display { font: 800 68px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .eyebrow { font: 700 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .copy { font: 500 22px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .card-title { font: 750 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .card-copy { font: 550 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .metric { font: 800 24px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .track { stroke-dasharray: 10 12; animation: move 2.2s linear infinite; }
    .packet { animation: travel 8s cubic-bezier(.45,0,.2,1) infinite; }
    .packet.two { animation-delay: -4s; }
    .active { animation: focus 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .active.two { animation-delay: -1.3s; }
    .active.three { animation-delay: -2.6s; }
    .active.four { animation-delay: -3.9s; }
    .active.five { animation-delay: -5.2s; }
    .bar { animation: grow 5s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    .bar.two { animation-delay: -1.4s; }
    .bar.three { animation-delay: -2.8s; }
    @keyframes move { to { stroke-dashoffset: -44; } }
    @keyframes travel {
      0%, 7% { transform: translate(0,0); opacity: 0; }
      10%, 24% { transform: translate(0,0); opacity: 1; }
      31%, 44% { transform: translate(124px,0); opacity: 1; }
      51%, 64% { transform: translate(248px,0); opacity: 1; }
      71%, 84% { transform: translate(372px,0); opacity: 1; }
      91%, 96% { transform: translate(496px,0); opacity: 1; }
      100% { transform: translate(496px,0); opacity: 0; }
    }
    @keyframes focus {
      0%, 14%, 100% { transform: translateY(0); opacity: .76; }
      5%, 10% { transform: translateY(-6px); opacity: 1; }
    }
    @keyframes grow {
      0%, 100% { transform: scaleX(.45); }
      50% { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .track, .packet, .active, .bar { animation: none !important; }
      .packet { opacity: 1; }
    }
  </style>

  <rect width="1400" height="620" rx="28" fill="#071A2C"/>
  <path d="M0 95H1400M0 190H1400M0 285H1400M0 380H1400M0 475H1400M170 0V620M340 0V620M510 0V620M680 0V620M850 0V620M1020 0V620M1190 0V620" stroke="#D9E8F6" stroke-opacity="0.045"/>

  <g transform="translate(76 70)">
    <rect width="226" height="34" rx="6" fill="#153551" stroke="#2F587A"/>
    <circle cx="20" cy="17" r="5" fill="#41D69A"/>
    <text x="34" y="22" class="eyebrow" fill="#C6D9EA">PAYROLL OPERATIONS</text>

    <g transform="translate(0 78)">
      <rect width="54" height="54" rx="10" fill="#2F80ED"/>
      <path d="M15 17h24v7H15zm0 13h17v7H15z" fill="white"/>
      <path d="M35 29h4v9h-4z" fill="#41D69A"/>
      <text x="72" y="45" class="display" fill="#F7FBFF">VetanFlow</text>
    </g>

    <text x="0" y="246" class="copy" fill="#B6C9DA">A controlled path from people records</text>
    <text x="0" y="278" class="copy" fill="#B6C9DA">to approved pay and private documents.</text>

    <g transform="translate(0 334)">
      <rect width="142" height="48" rx="7" fill="#F7FBFF"/>
      <text x="25" y="30" class="eyebrow" fill="#071A2C">EXPLORE FLOW</text>
      <rect x="156" width="168" height="48" rx="7" fill="#153551" stroke="#365E80"/>
      <text x="180" y="30" class="eyebrow" fill="#D9E8F6">6 ROLE SPACES</text>
    </g>

    <g transform="translate(0 426)">
      <g>
        <text x="0" y="0" class="metric" fill="#F7FBFF">10</text>
        <text x="0" y="24" class="card-copy" fill="#819AB0">showcase employees</text>
      </g>
      <g transform="translate(178 0)">
        <text x="0" y="0" class="metric" fill="#F7FBFF">2</text>
        <text x="0" y="24" class="card-copy" fill="#819AB0">closed pay cycles</text>
      </g>
      <g transform="translate(344 0)">
        <text x="0" y="0" class="metric" fill="#F7FBFF">RLS</text>
        <text x="0" y="24" class="card-copy" fill="#819AB0">data boundaries</text>
      </g>
    </g>
  </g>

  <g transform="translate(700 70)">
    <rect width="624" height="480" rx="16" fill="#F7FBFF"/>
    <rect width="624" height="62" rx="16" fill="#102D47"/>
    <path d="M0 46h624v16H0z" fill="#102D47"/>
    <circle cx="30" cy="31" r="6" fill="#FF6B6B"/>
    <circle cx="50" cy="31" r="6" fill="#F7C948"/>
    <circle cx="70" cy="31" r="6" fill="#41D69A"/>
    <text x="100" y="37" class="card-title" fill="#F7FBFF">June payroll close</text>
    <rect x="499" y="19" width="96" height="25" rx="5" fill="#153C5D"/>
    <text x="520" y="36" class="card-copy" fill="#BFD4E6">FINALIZED</text>

    <g transform="translate(26 88)">
      <rect width="572" height="102" rx="10" fill="#FFFFFF" stroke="#D7E3EE"/>
      <text x="18" y="27" class="card-copy" fill="#61798E">MONTH-END PIPELINE</text>
      <path d="M49 63H525" stroke="#C6D7E6" stroke-width="3" class="track"/>
      <circle cx="49" cy="63" r="8" fill="#2F80ED" class="packet"/>
      <circle cx="49" cy="63" r="5" fill="#41D69A" class="packet two"/>
      <g class="active"><circle cx="49" cy="63" r="17" fill="#E6F0FF" stroke="#2F80ED"/><path d="M43 63h12M49 57v12" stroke="#2F80ED" stroke-width="2"/></g>
      <g class="active two"><circle cx="173" cy="63" r="17" fill="#EDF8FF" stroke="#3B9DDD"/><path d="M166 59h14M166 64h10M166 69h12" stroke="#277FB8" stroke-width="2"/></g>
      <g class="active three"><circle cx="297" cy="63" r="17" fill="#FFF6DC" stroke="#E8A317"/><path d="M291 63l4 4 8-9" stroke="#A66C00" stroke-width="2.4" fill="none"/></g>
      <g class="active four"><circle cx="421" cy="63" r="17" fill="#E7FBF3" stroke="#22A06B"/><path d="M415 63l4 4 8-9" stroke="#168A58" stroke-width="2.4" fill="none"/></g>
      <g class="active five"><circle cx="545" cy="63" r="17" fill="#EEF0FF" stroke="#6B72D6"/><path d="M539 58h12v11h-12zM541 55h8" stroke="#545BC1" stroke-width="2" fill="none"/></g>
      <text x="25" y="94" class="card-copy" fill="#52697D">People</text>
      <text x="145" y="94" class="card-copy" fill="#52697D">Time</text>
      <text x="263" y="94" class="card-copy" fill="#52697D">Calculate</text>
      <text x="392" y="94" class="card-copy" fill="#52697D">Approve</text>
      <text x="519" y="94" class="card-copy" fill="#52697D">Deliver</text>
    </g>

    <g transform="translate(26 208)">
      <rect width="180" height="116" rx="10" fill="#FFFFFF" stroke="#D7E3EE"/>
      <text x="16" y="26" class="card-copy" fill="#61798E">NET PAY</text>
      <text x="16" y="61" class="metric" fill="#102D47">$61,284</text>
      <rect x="16" y="81" width="140" height="7" rx="3.5" fill="#E6EDF3"/>
      <rect x="16" y="81" width="112" height="7" rx="3.5" fill="#2F80ED" class="bar"/>
      <text x="16" y="105" class="card-copy" fill="#168A58">7 employees ready</text>
    </g>
    <g transform="translate(222 208)">
      <rect width="180" height="116" rx="10" fill="#FFFFFF" stroke="#D7E3EE"/>
      <text x="16" y="26" class="card-copy" fill="#61798E">ATTENDANCE</text>
      <text x="16" y="61" class="metric" fill="#102D47">LOCKED</text>
      <rect x="16" y="81" width="140" height="7" rx="3.5" fill="#E6EDF3"/>
      <rect x="16" y="81" width="126" height="7" rx="3.5" fill="#41D69A" class="bar two"/>
      <text x="16" y="105" class="card-copy" fill="#52697D">source data frozen</text>
    </g>
    <g transform="translate(418 208)">
      <rect width="180" height="116" rx="10" fill="#FFFFFF" stroke="#D7E3EE"/>
      <text x="16" y="26" class="card-copy" fill="#61798E">DOCUMENTS</text>
      <text x="16" y="61" class="metric" fill="#102D47">7 / 7</text>
      <rect x="16" y="81" width="140" height="7" rx="3.5" fill="#E6EDF3"/>
      <rect x="16" y="81" width="140" height="7" rx="3.5" fill="#6B72D6" class="bar three"/>
      <text x="16" y="105" class="card-copy" fill="#52697D">private PDFs published</text>
    </g>

    <g transform="translate(26 342)">
      <rect width="572" height="110" rx="10" fill="#102D47"/>
      <text x="18" y="28" class="card-copy" fill="#8FA9BF">CONTROL CHECKS</text>
      <g transform="translate(18 45)">
        <circle cx="8" cy="8" r="8" fill="#41D69A"/><path d="M4 8l3 3 5-6" stroke="#071A2C" stroke-width="2" fill="none"/>
        <text x="25" y="13" class="card-copy" fill="#E8F2FA">Maker-checker</text>
      </g>
      <g transform="translate(170 45)">
        <circle cx="8" cy="8" r="8" fill="#41D69A"/><path d="M4 8l3 3 5-6" stroke="#071A2C" stroke-width="2" fill="none"/>
        <text x="25" y="13" class="card-copy" fill="#E8F2FA">Immutable close</text>
      </g>
      <g transform="translate(334 45)">
        <circle cx="8" cy="8" r="8" fill="#41D69A"/><path d="M4 8l3 3 5-6" stroke="#071A2C" stroke-width="2" fill="none"/>
        <text x="25" y="13" class="card-copy" fill="#E8F2FA">Signed access</text>
      </g>
      <rect x="18" y="78" width="536" height="1" fill="#294C69"/>
      <text x="18" y="100" class="card-copy" fill="#8FA9BF">React 19  ·  Express 5  ·  Supabase Auth, Postgres, RLS &amp; Storage</text>
    </g>
  </g>
</svg>
